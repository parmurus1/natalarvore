<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Feliz Natal!!!</title>
<style>
:root{color-scheme:dark;--bg:#000;--gold:#ffd98a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000}}
:root[data-theme="dark"]{--bg:#000}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:"Courier New",Courier,monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#hud{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);margin:0;font:11px/1.5 "Courier New",monospace;color:#6f7d90;pointer-events:none}
#tt{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);font:12px "Courier New",monospace;color:#ff7ab6;pointer-events:none}
#rep{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 8px);padding:5px 8px;border:1px solid rgba(255,217,138,.4);background:rgba(0,0,0,.5);color:var(--gold);font:700 11px "Courier New",monospace;cursor:pointer;z-index:3}
</style>
</head>
<body>
<canvas id="c"></canvas>
<pre id="hud"></pre><div id="tt"></div>
<button id="rep">[ repetir ]</button>
<script>
(()=>{
const $=id=>document.getElementById(id),X=$('c').getContext('2d',{alpha:false}),rnd=Math.random,TAU=6.2832;
const mk=()=>{const c=document.createElement('canvas');return[c,c.getContext('2d',{alpha:false})]};
const [AC,A2]=mk(),[S2,S2c]=mk(),[S4,S4c]=mk(),[S8,S8c]=mk(),ATC=document.createElement('canvas'),ATX=ATC.getContext('2d');
const MOB=matchMedia('(pointer:coarse)').matches||Math.min(screen.width,screen.height)<700;
let W,Hh,DPR,U,F,CX,CY,cA=1,sA=0,CS,cw,chh,cols,rows,dep,chA,colA,bloom=MOB?1:2,QS=MOB?1.15:1,DET=MOB?.3:1,DPRC=MOB?1.25:2,atCols=1,atMax=1,atN=0;
const touched=[],cc={},atM=new Map(),CAM=7,TILT=.2,CEN=1.55,cT=Math.cos(TILT),sT=Math.sin(TILT);
const stars=[],snow=[],parts=[];
for(let i=0;i<(MOB?110:200);i++)stars.push({x:rnd(),y:rnd(),s:rnd(),ph:rnd()*9});
for(let i=0;i<(MOB?55:100);i++)snow.push({x:rnd(),y:rnd(),v:.04+rnd()*.07,ph:rnd()*9});
const css=c=>cc[c]||(cc[c]='#'+(c|0x1000000).toString(16).slice(1));

function resize(){DPR=Math.min(window.devicePixelRatio||1,DPRC);W=$('c').width=Math.round(innerWidth*DPR);Hh=$('c').height=Math.round(innerHeight*DPR);U=Math.min(Hh*.19,W*.29);F=U*CAM;CX=W/2;CY=Hh*.52;
CS=Math.max(8*DPR,U*.085)*QS;cw=Math.max(4,Math.round(CS*.6));chh=Math.max(7,Math.round(CS));cols=Math.ceil(W/cw)+1;rows=Math.ceil(Hh/chh)+1;
dep=new Float32Array(cols*rows);chA=new Array(cols*rows);colA=new Uint32Array(cols*rows);
AC.width=W;AC.height=Hh;S2.width=W>>1;S2.height=Hh>>1;S4.width=W>>2;S4.height=Hh>>2;S8.width=W>>3;S8.height=Hh>>3;A2.fillStyle='#000';A2.fillRect(0,0,W,Hh);
ATC.width=ATC.height=2048;atCols=Math.floor(2048/cw);atMax=atCols*Math.floor(2048/chh);atM.clear();atN=0;
ATX.font=`bold ${Math.round(chh)}px "Courier New",Courier,monospace`;ATX.textAlign='center';ATX.textBaseline='middle'}
addEventListener('resize',resize);resize();

/* grade ASCII com z-buffer: um caractere por célula */
function put(x,y,z,ch,r,g,b){const cx=(x/cw)|0,cy=(y/chh)|0;if(x<0||y<0||cx>=cols||cy>=rows)return;const i=cy*cols+cx;if(z<dep[i]){if(dep[i]===Infinity)touched.push(i);dep[i]=z;chA[i]=ch;colA[i]=(((r>255?255:r)>>3<<3)<<16)|(((g>255?255:g)>>3<<3)<<8)|((b>255?255:b)>>3<<3)}}
/* atlas de glifos: cada (letra, cor) é desenhado uma vez e depois só copiado */
function slot(ch,c){const key=ch.charCodeAt(0)*16777216+c;let s=atM.get(key);if(s===undefined){if(atN>=atMax){atM.clear();atN=0;ATX.clearRect(0,0,2048,2048)}s=atN++;ATX.fillStyle=css(c);ATX.fillText(ch,(s%atCols)*cw+cw/2,((s/atCols)|0)*chh+chh/2);atM.set(key,s)}return s}

let px,py,ps,pz;
function proj(x,y,z){const x1=x*cA+z*sA,z1=-x*sA+z*cA,yy=y-CEN;const y2=yy*cT+z1*sT;pz=-yy*sT+z1*cT+CAM;ps=F/pz;px=CX+x1*ps;py=CY-y2*ps}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* mouse balança folhas e bolinhas */
let mx=-1e5,my=-1e5,mvx=0,mvy=0,ME=0;
addEventListener('pointermove',e=>{const nx=e.clientX*DPR,ny=e.clientY*DPR;if(mx>-1e4){const dx=nx-mx,dy=ny-my;mvx=mvx*.6+dx*.4;mvy=mvy*.6+dy*.4;ME=Math.min(1.4,ME+Math.hypot(dx,dy)/(U*.45))}mx=nx;my=ny});
addEventListener('pointerdown',e=>{mx=e.clientX*DPR;my=e.clientY*DPR});
function sway(p){if(!p.sw||ME<.01)return;const dx=px-mx,dy=py-my,MR=U*1.15,d2=dx*dx+dy*dy;if(d2>=MR*MR)return;const f=1-Math.sqrt(d2)/MR,w=f*f*ME*p.sw,hh=p.h||(p.ph||0)*97,cap=U*.3,tn=performance.now()/1e3;px+=clamp(mvx*w,-cap,cap)+Math.sin(tn*12+hh*.37)*w*U*.08;py+=clamp(mvy*w,-cap,cap)+Math.cos(tn*10+hh*.53)*w*U*.06}

const P=[],G=[];
function add(a,x,y,z,r,g,b,t,o){const p={x,y,z,r,g,b,t};if(o)Object.assign(p,o);a.push(p);return p}
const POOLS=['1il!;:','rtfjcvxz=+','aeoun0{}[]<>','08B$#&%Q'],ORN='@O0o*';
const Y0=.5,Y1=3.5,TG=[.8,5.6],gt=y=>TG[0]+(TG[1]-TG[0])*clamp(y/Y1,0,1);
const env=y=>1.55*Math.pow(1-clamp((y-Y0)/(Y1-Y0),0,1),.9)+.04;

/* galhos caídos em camadas */
for(let i=0;i<22;i++){const y=Y0+.02+(Y1-Y0-.08)*i/21,u=(y-Y0)/(Y1-Y0),R=env(y)+.05,nb=Math.round(6+12*(1-u));
for(let b=0;b<nb;b++){const a=TAU*(b+.5*rnd())/nb+i*.77,L=R*(.85+.23*rnd()),n=Math.round(8+40*L);
for(let k=0;k<n;k++){const s=.2+.8*rnd(),r=L*s,yy=y-.3*L*s*s+(rnd()-.5)*.06,aa=a+(rnd()-.5)*.25,dm=.6+.5*s;
add(P,r*Math.cos(aa),yy,r*Math.sin(aa),(15+rnd()*50)*dm,(100+rnd()*130)*dm,(25+rnd()*50)*dm,gt(yy)+rnd()*.15,{pool:1,h:(rnd()*1e4)|0,l:.5+.5*rnd(),sw:1,lq:rnd()})}}}
/* cone interno escuro */
for(let k=0;k<6000;k++){const y=Y0+rnd()*(Y1-Y0-.1),a=rnd()*TAU,r=.6*env(y);add(P,r*Math.cos(a),y,r*Math.sin(a),10,45+rnd()*25,14,gt(y)+rnd()*.15,{ch:'.:;'[k%3],lq:rnd()})}
/* tronco */
for(let k=0;k<700;k++){const y=rnd()*(Y0+.1),a=rnd()*TAU;add(P,.13*Math.cos(a),y,.13*Math.sin(a),(110+rnd()*40)*(.75+.25*Math.sign(Math.sin(a*30+y*5))),70+rnd()*25,35,.4+y,{ch:'#%|H'[k%4]})}
/* guirlanda dourada */
for(let s=0;s<1;s+=1/650){const y=.8+s*2.35-.11*Math.sin((s*5.5%1)*Math.PI),th=s*5.5*TAU;add(P,(env(y)*.97+.07)*Math.cos(th),y,(env(y)*.97+.07)*Math.sin(th),255,200,60,5.7+s*2.3,{br:1.3,ch:'~=-+'[(rnd()*4)|0]})}
/* luzes */
const warm=[255,238,180],lc=[[255,70,60],[100,170,255],[255,100,210],[120,255,150]];
for(let i=0;i<114;i++){const y=.75+rnd()*2.5,th=rnd()*TAU,r=env(y)*.92+.06,c=rnd()<.8?warm:lc[i%4];add(G,r*Math.cos(th),y,r*Math.sin(th),c[0],c[1],c[2],6+i*.045,{ph:rnd()*9,sw:1.2})}
/* bolinhas vermelhas */
for(let i=0;i<26;i++){const y=.85+(i/26)*2.35+rnd()*.06,r0=env(y)*.9+.06,th=i*2.399,cx=r0*Math.cos(th),cz=r0*Math.sin(th),tt=gt(y)+.3+rnd()*.4;
for(let k=0;k<44;k++){const yy=1-2*(k+.5)/44,rad=Math.sqrt(1-yy*yy),a=k*2.399,nx=rad*Math.cos(a),nz=rad*Math.sin(a);add(P,cx+nx*.1,y+yy*.1,cz+nz*.1,225,28,38,tt,{nx,ny:yy,nz,orn:1,sw:2,h:(i*977)%1e4})}}
/* presentes */
function present(x0,z0,w,h,col,rib,t,rot){const s=.045,n=Math.round(w/s),m=Math.round(h/s),cr=Math.cos(rot),sr=Math.sin(rot);
const q=(lx,y,lz,r)=>{const c=r?rib:col;add(P,x0+lx*cr+lz*sr,y,z0-lx*sr+lz*cr,c[0],c[1],c[2],t,{drop:1,ch:(r?'+=*#':'#%@&')[(rnd()*4)|0]})};
for(let i=0;i<=n;i++){const u=-w/2+i*s;for(let j=0;j<=n;j++){const v=-w/2+j*s;q(u,h,v,Math.abs(u)<.045||Math.abs(v)<.045)}
for(let j=0;j<=m;j++){const y=j*s,r=Math.abs(u)<.045;q(u,y,-w/2,r);q(u,y,w/2,r);q(-w/2,y,u,r);q(w/2,y,u,r)}}
for(let k=0;k<14;k++){const a=k/14*TAU,yy=h+.05+Math.abs(Math.sin(a))*.06;q(Math.cos(a)*.07+.07,yy,0,1);q(Math.cos(a)*.07-.07,yy,0,1)}}
present(1.3,.95,.42,.36,[215,35,45],[255,205,90],5,.3);
present(-1.25,.7,.34,.3,[255,195,70],[215,35,45],5.4,-.4);
present(.35,-1.35,.3,.26,[40,160,80],[215,35,45],5.8,.2);
present(-.6,1.35,.26,.22,[70,120,240],[240,240,255],6.1,.5);

function burst(x,y,n){for(let i=0;i<n;i++){const a=rnd()*TAU,v=(.2+rnd()*.9)*U*1.6;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1+rnd()*.7,m:1.7,c:[[255,215,120],[255,120,160],[120,210,255],[160,255,170]][i%4]})}}
let fired=false,T0=0,last=0,fc=0,ema=16,slow=0;
$('c').addEventListener('pointerdown',e=>burst(e.clientX*DPR,e.clientY*DPR,40));

/* chão de texto + tapete vermelho, célula a célula */
const FL=".:-=+,;`'";
function floor(now){const RR=2.55*clamp((now-.2)/1.6,0,1);
for(let cy=0;cy<rows;cy++){const sy=(cy+.5)*chh,k=(CY-sy)/F,den=k*cT-sT;if(den>=-.002)continue;const yy=-CEN,z1=(yy*cT-k*(-yy*sT+CAM))/den,z2=-yy*sT+z1*cT+CAM;if(z2<=0)continue;
for(let cx=0;cx<cols;cx++){const sx=(cx+.5)*cw,x1=(sx-CX)*z2/F,wx=x1*cA-z1*sA,wz=x1*sA+z1*cA,d2=wx*wx+wz*wz;if(d2>300)continue;
let h=Math.imul(Math.floor(wx*6),374761393)^Math.imul(Math.floor(wz*6),668265263);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;h>>>=0;
if(d2<RR*RR){const rr=Math.sqrt(d2);let rc,rg,rb,rch;if(rr>2.3){rc=235;rg=185;rb=70;rch='=#'[h&1]}else if(rr>2.12){rc=120;rg=14;rb=24;rch='%'}else if(rr>1.95&&rr<2.05){rc=240;rg=190;rb=80;rch='*+'[h&1]}else{const w=.78+.22*Math.sin(Math.atan2(wz,wx)*12+rr*9);rc=215*w;rg=26*w;rb=36*w;rch='#%W&8@'[(h>>>4)%6]}put(sx,sy,50+z2,rch,rc,rg,rb);continue}
if(h%100>90-d2*.28)continue;const v=25+95/(1+d2*.04);put(sx,sy,200+z2,FL[(h>>>8)%FL.length],v*.7,v*.85,v)}}}

/* estrela do topo: sempre de frente para a câmera */
function star(now){if(now<5.8)return;proj(0,3.52,0);const k=clamp((now-5.8)/.8,0,1),tw=.9+.1*Math.sin(now*2.4),R=U*.34*k,r2=R*.42,cx=px,cy=py-R*.62,pts=[];
for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?r2:R;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}
const ins=(x,y)=>{let c=false;for(let i=0,j=9;i<10;j=i++){const[a,b]=pts[i],[d,e]=pts[j];if((b>y)!==(e>y)&&x<(d-a)*(y-b)/(e-b)+a)c=!c}return c};
const c0=((cx-R)/cw|0)-1,c1=((cx+R)/cw|0)+1,r0=((cy-R)/chh|0)-1,r1=((cy+R)/chh|0)+1;
for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const x=(c+.5)*cw,y=(r+.5)*chh;if(!ins(x,y))continue;
const edge=!ins(x-cw,y)||!ins(x+cw,y)||!ins(x,y-chh)||!ins(x,y+chh),d=Math.min(1,Math.hypot(x-cx,y-cy)/R);
if(edge)put(x,y,-9,'*',255*tw,238*tw,150*tw);else put(x,y,-9,'#8B$&@'[((c*7+r*13)%6+6)%6],255*tw,(215+40*(1-d))*tw,(90+130*(1-d))*tw)}
const L=Math.round(k*R*2.4/cw),Lv=Math.round(k*R*1.9/chh);
for(let i=1;i<=L;i++){const v=(1-i/(L+1))*(.75+.25*Math.sin(now*3));put(cx+i*cw,cy,-8.9,'-',255*v,230*v,150*v);put(cx-i*cw,cy,-8.9,'-',255*v,230*v,150*v)}
for(let i=1;i<=Lv;i++){const v=(1-i/(Lv+1))*(.75+.25*Math.sin(now*3+2));put(cx,cy+i*chh,-8.9,'|',255*v,230*v,150*v);put(cx,cy-i*chh,-8.9,'|',255*v,230*v,150*v)}
const Ld=Math.round(Lv*.65);for(let i=1;i<=Ld;i++){const v=(1-i/(Ld+1))*(.7+.3*Math.sin(now*3+4)),o=i*cw;put(cx+o,cy+i*chh,-8.9,'\\',255*v,225*v,140*v);put(cx-o,cy-i*chh,-8.9,'\\',255*v,225*v,140*v);put(cx+o,cy-i*chh,-8.9,'/',255*v,225*v,140*v);put(cx-o,cy+i*chh,-8.9,'/',255*v,225*v,140*v)}
for(let r=r0-2;r<=r1+2;r++)for(let c=c0-3;c<=c1+3;c++){const x=(c+.5)*cw,y=(r+.5)*chh,d=Math.hypot(x-cx,y-cy)/R;if(d<1.2||d>1.7||((c*31+r*17)%7))continue;const v=(.45+.45*Math.sin(now*2+c+r))*k;put(x,y,-8.8,'.+'[(c+r)&1],255*v,225*v,140*v)}}

/* papai noel e renas cruzando o céu, atrás da árvore */
const RD=['........A.A...','........AAA...','........####N.','.......####...','.#########....','##########....','.########.....'],LG=[['.##......##...','##........##..'],['..##....##....','...#....#.....']];
const SL=['..........W..........','.........RRR.........','.........FFF....SS...','........RRRRR..SSSS..','..RRRRRRRRRRRRRRRRRRR','..RRRRRRRRRRRRRRRRRRR','...RRRRRRRRRRRRRRRRR.','..GGGGGGGGGGGGGGGGGGG','.GG...............GGG'];
const SC={'#':[150,100,62,'#%&8'],A:[215,185,120,'Y'],N:[255,70,60,'@'],W:[245,245,250,'O'],R:[215,40,45,'%&'],F:[255,210,175,'o'],S:[160,105,52,'#'],G:[245,195,75,'='],'-':[240,200,90,'-']};
const dust=[],pk=(r,g,b)=>(((r>255?255:r)>>3<<3)<<16)|(((g>255?255:g)>>3<<3)<<8)|((b>255?255:b)>>3<<3);
function sleigh(now,dt){
for(let i=dust.length-1;i>=0;i--){const d=dust[i];d.l-=dt;if(d.l<=0){dust.splice(i,1);continue}d.x+=d.vx*dt;d.y+=d.vy*dt;const a=clamp(d.l/1.3,0,1);put(d.x,d.y,90,'.',200*a,215*a,235*a)}
const u=(now-6)/34;if(u<0)return;const k=Math.floor(u),f=u-k,mv=.65;if(f>mv)return;
const n=cols>110?3:2,Ws=25+17*(n-1)+14,sx=W*(cols>110?.2:.34)/Ws,p=f/mv,flip=k&1,X0=-Ws*sx+(W+Ws*sx)*p,Y0=Hh*(.06+.03*Math.sin(p*3+k))+Math.sin(now*1.2)*sx*.4,dw=sx*1.1,dh=sx*1.25;
const pix=(lx,ly,t,by)=>{const c=SC[t];if(!c)return;const x=flip?W-X0-(lx+1)*sx:X0+lx*sx,y=Y0+ly*sx+(by||0),i=((y+dh/2)/chh|0)*cols+((x+dw/2)/cw|0);if(x<-sx||x>W||y<0||i<0||i>=dep.length||dep[i]<80)return;
let b=.85+.15*(((lx*7+ly*13)%5)/4);if(t==='N')b=.75+.25*Math.sin(now*6);const pl=c[3],s=slot(pl[(lx*3+ly)%pl.length],pk(236*b,242*b,255*b));
A2.drawImage(ATC,(s%atCols)*cw,((s/atCols)|0)*chh,cw,chh,x,y,dw,dh)};
for(let ly=0;ly<9;ly++)for(let lx=0;lx<21;lx++)pix(lx,ly,SL[ly][lx]);
for(let lx=21;lx<25+17*(n-1)+5;lx++){let on=0;for(let j=0;j<n;j++){const xr=25+17*j;if(lx>=xr&&lx<xr+11)on=1}if(!on)pix(lx,5,'-')}
for(let j=0;j<n;j++){const xr=25+17*j,by=Math.sin(now*3.5+j*1.3)*sx*.5,rw=[...RD,...LG[((now*3.5+j*.6)|0)&1]];
for(let ly=0;ly<9;ly++){const row=rw[ly];for(let lx=0;lx<14;lx++){let t=row[lx];if(t==='N'&&j<n-1)t='#';pix(xr+lx,ly,t,by)}}}
if(rnd()<.35){const lx=rnd()*Ws;dust.push({x:flip?W-X0-(lx+1)*sx:X0+lx*sx,y:Y0+(6+rnd()*3)*sx,vx:(flip?1:-1)*sx*2,vy:sx*(.5+rnd()*2),l:1.3})}
}
function frame(ms){
requestAnimationFrame(frame);
if(MOB&&ms-last<30)return;if(!T0)T0=ms;const now=(ms-T0)/1000,dt=Math.min(.05,(ms-last)/1000||.016);last=ms;
const A=.4+now*.31;cA=Math.cos(A);sA=Math.sin(A);ME*=Math.exp(-dt*1.5);mvx*=Math.exp(-dt*4);mvy*=Math.exp(-dt*4);
dep.fill(Infinity);touched.length=0;
floor(now);
const sf=clamp(now/1.2,0,1);
for(const s of stars){const v=(sf*(.35+.65*Math.abs(Math.sin(now*.9+s.ph)))*235)|0;put(s.x*W,s.y*Hh,100,s.s>.35?'+':s.s>.12?'*':'.',v,v,v)}

for(const p of P){const age=now-p.t;if(age<0||p.lq>DET)continue;let y=p.y;if(p.drop){const d=1-age/.9;if(d>0)y+=d*d*4}
proj(p.x,y,p.z);sway(p);const br=clamp(.72-.5*(pz-CAM)/2.4,.22,1.15)*(p.br||1);let r=p.r*br,g=p.g*br,b=p.b*br,ch=p.ch;
if(p.pool){const pl=POOLS[Math.min(3,(clamp(br*p.l*1.1,0,1)*3.2)|0)];ch=pl[(p.h+((now*4+p.h%11)|0))%pl.length]}
if(p.orn){const nz=-p.nx*sA+p.nz*cA,lit=clamp(.5-nz*.5+p.ny*.25,0,1),bb=.35+.85*lit;r=p.r*bb;g=p.g*bb;b=p.b*bb;ch=ORN[Math.min(4,((1-lit)*5)|0)];if(lit>.88){r=255;g=200;b=200}}
if(age<.8){if(age<.3){ch='#';r=g=b=255}else{const f=1-(age-.3)/.5;r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}}
put(px,py,pz,ch,r,g,b)}

let nl=0;
for(const p of G){const age=now-p.t;if(age<0)continue;proj(p.x,p.y,p.z);sway(p);nl++;const tw=.5+.5*Math.sin(now*2.2+p.ph);
put(px,py,pz-.4,age<.3?'@':tw>.8?'@':tw>.5?'O':tw>.25?'o':'+',p.r,p.g,p.b)}
star(now);if(now>5.8&&!fired){fired=true;proj(0,3.52,0);burst(px,py-U*.2,70)}

const sa=clamp((now-6)/2,0,1);
if(sa>0)for(const f of snow){f.y+=f.v*dt;f.x+=Math.sin(now+f.ph)*dt*.02;if(f.y>1){f.y=-.02;f.x=rnd()}const v=230*sa|0;put(f.x*W,f.y*Hh,-20,f.v>.07?'*':'.',v,v,v)}
for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=dt;if(q.l<=0){parts.splice(i,1);continue}q.vy+=U*.9*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.985;const a=clamp(q.l/q.m,0,1);put(q.x,q.y,-30,a>.6?'*':a>.3?'+':'.',q.c[0]*a+40,q.c[1]*a+40,q.c[2]*a+40)}

/* rastro curto + desenho dos glifos copiados do atlas */
A2.fillStyle='rgba(0,0,0,.42)';A2.fillRect(0,0,W,Hh);sleigh(now,dt);
for(let k=0;k<touched.length;k++){const i=touched[k],s=slot(chA[i],colA[i]);A2.drawImage(ATC,(s%atCols)*cw,((s/atCols)|0)*chh,cw,chh,(i%cols)*cw,((i/cols)|0)*chh,cw,chh)}
X.globalCompositeOperation='source-over';X.drawImage(AC,0,0);
if(bloom>0){S2c.drawImage(AC,0,0,S2.width,S2.height);if(!MOB)S4c.filter='blur(1px)';S4c.drawImage(S2,0,0,S4.width,S4.height);S4c.filter='none';if(!MOB)S8c.filter='blur(2px)';S8c.drawImage(S4,0,0,S8.width,S8.height);S8c.filter='none';
X.globalCompositeOperation='lighter';if(bloom>1){X.globalAlpha=.8;X.drawImage(S4,0,0,W,Hh)}X.globalAlpha=.5;X.drawImage(S8,0,0,W,Hh);X.globalAlpha=1;X.globalCompositeOperation='source-over'}

/* qualidade adaptativa: se ficar lento, tira o brilho e depois engrossa a grade */
ema=ema*.95+dt*1000*.05;
if(now>(MOB?3:10)&&ema>(MOB?42:36)){if(++slow>(MOB?25:150)){slow=0;if(DET>.25)DET-=.1;else if(bloom>0)bloom--;else if(QS<1.8){QS+=.2;resize()}else if(DPRC>1){DPRC=1;resize()}}}else slow=0;

if(++fc%(MOB?12:3)===0){$('tt').textContent=(((now*2)|0)%2===0?'\u25cf':' ')+' t '+now.toFixed(2).padStart(5,'0')+'s';
$('hud').textContent='rotation '+(((A*180/Math.PI)%360+360)%360).toFixed(2).padStart(6,'0')+'\u00b0\nlights   '+nl+'\nletters  '+touched.length.toLocaleString('en')+'\ninspired by @dwcminh.ascii'}
}
requestAnimationFrame(frame);
$('rep').onclick=()=>{T0=0;fired=false;parts.length=0};
})();
